<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1.0,viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light" />
		<title>Physically Precise Water</title>
		<style>
			:root {
				--color: #000;
				--box: #e6e6e6;
				--outline: #c3c3c3;
			}
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
				padding: 0;
			}
			body {
				background: var(--box);
				overflow: hidden;
				touch-action: none;
				overscroll-behavior: none;
				-webkit-tap-highlight-color: transparent;
			}
			#gl {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				display: block;
				z-index: 0;
			}
			#fallback {
				position: fixed;
				inset: 0;
				z-index: 0;
				display: none;
				background: radial-gradient(
					120% 90% at 20% 20%,
					#f5f5f5 0%,
					var(--box) 40%,
					var(--outline) 100%
				);
			}
			body.nogl #fallback {
				display: block;
			}
			.shape {
				position: fixed;
				z-index: 5;
				pointer-events: none;
				--pad: 55px;
			}
			.shape > * {
				position: absolute;
				inset: 0;
			}
			.fill {
				background: rgba(230, 230, 230, 0.65);
				-webkit-backdrop-filter: blur(10px);
				backdrop-filter: blur(10px);
			}
			.ring {
				background: var(--outline);
			}
			.ink {
				background: var(--color);
			}
			body.lite .fill:not(.ink) {
				background: rgba(230, 230, 230, 0.95);
				-webkit-backdrop-filter: none;
				backdrop-filter: none;
			}
			@media (prefers-reduced-transparency: reduce) {
				.fill:not(.ink) {
					background: rgba(230, 230, 230, 0.95);
					-webkit-backdrop-filter: none;
					backdrop-filter: none;
				}
			}
			.s-panel {
				left: calc(15vw - var(--pad));
				top: calc(25vh - var(--pad));
				width: calc(30vw + var(--pad) * 2);
				height: calc(40vh + var(--pad) * 2);
			}
			.s-disc {
				left: calc(60vw - var(--pad));
				top: calc(30vh - var(--pad));
				width: calc(25vh + var(--pad) * 2);
				height: calc(25vh + var(--pad) * 2);
			}
			.s-mark {
				--pad: 35px;
				left: calc(50vw - var(--pad));
				top: calc(70vh - var(--pad));
				width: calc(5vh + var(--pad) * 2);
				height: calc(5vh + var(--pad) * 2);
			}
			@media (max-width: 900px) {
				.shape {
					--pad: 45px;
				}
				.s-panel {
					left: calc(10vw - var(--pad));
					top: calc(15vh - var(--pad));
					width: calc(50vw + var(--pad) * 2);
					height: calc(30vh + var(--pad) * 2);
				}
				.s-disc {
					left: calc(40vw - var(--pad));
					top: calc(55vh - var(--pad));
					width: calc(25vh + var(--pad) * 2);
					height: calc(25vh + var(--pad) * 2);
				}
				.s-mark {
					--pad: 30px;
					left: calc(15vw - var(--pad));
					top: calc(60vh - var(--pad));
					width: calc(10vh + var(--pad) * 2);
					height: calc(10vh + var(--pad) * 2);
				}
			}
		</style>
	</head>
	<body>
		<div id="deco" aria-hidden="true">
			<canvas id="gl"></canvas>
			<div id="fallback"></div>
			<div class="shape s-panel" data-shape="rect" data-n="70">
				<div class="fill"></div>
				<div class="ring"></div>
			</div>
			<div class="shape s-disc" data-shape="circle" data-n="70">
				<div class="fill"></div>
				<div class="ring"></div>
			</div>
			<div class="shape s-mark" data-shape="rect" data-n="40">
				<div class="fill ink"></div>
			</div>
		</div>
		<script>
			'use strict'
			;(function () {
				var canvas = document.getElementById('gl')
				var gl = canvas.getContext('webgl2', {
					alpha: false,
					depth: false,
					antialias: false,
					powerPreference: 'high-performance',
					desynchronized: true
				})
				function bail() {
					document.body.classList.add('nogl')
				}
				if (!gl) {
					bail()
					return
				}
				var F32 = !!(
					gl.getExtension('EXT_color_buffer_float') &&
					gl.getExtension('OES_texture_float_linear')
				)
				if (!F32 && !gl.getExtension('EXT_color_buffer_half_float')) {
					bail()
					return
				}
				var motionMq = matchMedia('(prefers-reduced-motion: reduce)')
				var reduced = motionMq.matches
				var rndState = (performance.now() * 65536) >>> 0 || 1
				function rnd() {
					rndState ^= rndState << 13
					rndState >>>= 0
					rndState ^= rndState >>> 17
					rndState ^= rndState << 5
					rndState >>>= 0
					return rndState / 4294967296
				}
				function clamp(v, lo, hi) {
					return Math.min(Math.max(v, lo), hi)
				}
				var VERT = `#version 300 es
out vec2 vUv;
void main(){
vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));
vUv=p;
gl_Position=vec4(p*2.0-1.0,0.0,1.0);
}`
				var FRAG_SIM = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 outState;
uniform sampler2D uState;
uniform vec2 uAspect;
uniform float uK;
uniform float uDampV;
uniform float uDampH;
uniform float uNu;
uniform float uRadius;
uniform float uAmp;
uniform float uEdge;
uniform float uDT;
uniform vec4 uSA[6];
uniform vec3 uDrop;
void main(){
vec2 uv=vUv;
vec2 st=texture(uState,uv).rg;
float h=st.x;
float v=st.y;
float hL=textureOffset(uState,uv,ivec2(-1,0)).r;
float hR=textureOffset(uState,uv,ivec2(1,0)).r;
float hD=textureOffset(uState,uv,ivec2(0,-1)).r;
float hU=textureOffset(uState,uv,ivec2(0,1)).r;
float hLD=textureOffset(uState,uv,ivec2(-1,-1)).r;
float hRD=textureOffset(uState,uv,ivec2(1,-1)).r;
float hLU=textureOffset(uState,uv,ivec2(-1,1)).r;
float hRU=textureOffset(uState,uv,ivec2(1,1)).r;
float lap=0.5*(hL+hR+hD+hU)+0.25*(hLD+hRD+hLU+hRU)-3.0*h;
v+=uK*lap;
float b=min(min(uv.x,1.0-uv.x),min(uv.y,1.0-uv.y));
float sp=smoothstep(0.0,uEdge,b);
v=v*uDampV*mix(0.955,1.0,sp);
h=(h+v+uNu*lap)*uDampH*mix(0.985,1.0,sp);
vec2 P=uv*uAspect;
float r2=uRadius*uRadius;
float ir2=1.0/r2;
float iRad=1.0/uRadius;
float lim2=r2*10.0;
for(int i=0;i<3;i++){
vec4 ag=uSA[i+3];
if(ag.w<=0.0) continue;
vec4 sg=uSA[i];
vec2 ba=sg.zw-sg.xy;
vec2 pa=P-sg.xy;
float t=clamp(dot(pa,ba)/max(dot(ba,ba),1e-7),0.0,1.0);
vec2 rel=pa-ba*t;
float d2=dot(rel,rel);
if(d2>lim2) continue;
float g=exp(-d2*ir2);
float spd=min(length(ag.xy),4.0);
vec2 vdir=spd>1e-4?ag.xy/spd:vec2(0.0);
float dip=clamp(dot(rel,vdir)*iRad,-2.0,2.0);
h+=uAmp*ag.w*g*(-0.25+1.35*dip)*spd*uDT;
float pr=ag.z*ag.w;
if(pr>0.0) h=mix(h,-uAmp*0.025*g,clamp(g*pr*uDT*25.0,0.0,0.5));
}
if(uDrop.z!=0.0){
vec2 dp=P-uDrop.xy;
h+=uDrop.z*exp(-dot(dp,dp)*ir2*(1.0/0.25));
}
outState=vec4(clamp(h,-1.5,1.5),clamp(v,-1.5,1.5),0.0,1.0);
}`
				var FRAG_RENDER = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uState;
uniform vec2 uAspect;
uniform vec3 uFloor;
uniform float uTime;
uniform float uGradScale;
uniform float uEta;
uniform float uDepth;
uniform float uIor;
uniform float uRough;
uniform float uWide;
uniform float uSheen;
uniform float uGloss;
uniform float uSwell;
uniform float uSigma;
uniform vec3 uSun;
const float PI=3.14159265359;
const float C_BOX=0.7915;
const float C_OUT=0.5455;
float hash21(vec2 p){
vec3 q=fract(p.xyx*vec3(0.1031,0.1030,0.0973));
q+=dot(q,q.yzx+33.33);
return fract((q.x+q.y)*q.z);
}
void addWave(vec2 p,float t,float ang,float L,float amp,inout float Ht,inout vec2 G){
vec2 d=vec2(cos(ang),sin(ang));
float k=6.28318530718/L;
float ph=k*dot(d,p)-sqrt(0.35*k)*t;
Ht+=amp*sin(ph);
G+=amp*k*cos(ph)*d;
}
float skyCol(vec3 r){
float c=mix(C_BOX*0.85,1.05,pow(clamp(r.z*0.5+0.5,0.0,1.0),1.5));
float s=max(dot(r,uSun),0.0);
return c+pow(s,2400.0)*10.0+0.075*pow(s,30.0);
}
float ggx(float NoH,float NoV,float NoL,float rough,float F){
float a=max(rough,0.015);
a=a*a;
float a2=a*a;
float dd=NoH*NoH*(a2-1.0)+1.0;
float k=a*0.5;
float G=(NoV/(NoV*(1.0-k)+k))*(NoL/(NoL*(1.0-k)+k));
return a2/(PI*dd*dd)*G*F/(4.0*NoV*max(NoL,1e-4))*NoL;
}
void main(){
vec2 uv=vUv;
vec2 p=uv*uAspect;
float h=texture(uState,uv).r;
float hL=textureOffset(uState,uv,ivec2(-2,0)).r;
float hR=textureOffset(uState,uv,ivec2(2,0)).r;
float hD=textureOffset(uState,uv,ivec2(0,-2)).r;
float hU=textureOffset(uState,uv,ivec2(0,2)).r;
vec2 grad=vec2(hR-hL,hU-hD)*uGradScale;
float sHt=0.0;
vec2 sG=vec2(0.0);
addWave(p,uTime,0.35,2.5,1.0,sHt,sG);
addWave(p,uTime,-0.85,1.75,0.55,sHt,sG);
addWave(p,uTime,1.95,1.15,0.25,sHt,sG);
grad+=sG*uSwell;
float eta=h*uEta+sHt*uSwell;
vec3 N=normalize(vec3(-grad,1.0));
vec3 V=normalize(vec3(-(uv-0.5)*uAspect*0.25,1.0));
vec3 I=-V;
float NoV=clamp(dot(N,V),1e-4,1.0);
const float F0=0.0205;
float Fr=F0+(1.0-F0)*pow(1.0-NoV,5.0);
vec3 T=refract(I,N,uIor);
float invTz=1.0/-min(T.z,-0.15);
float trans=exp(-uSigma*max(uDepth+eta,0.025)*invTz);
float lum=1.0-0.35*smoothstep(0.05,1.05,length((p+T.xy*(uDepth*invTz)-uFloor.xy)*uFloor.z));
float col=mix(mix(C_OUT*0.85,C_BOX*lum,trans),skyCol(reflect(I,N)),Fr);
float aaR=clamp(length(fwidth(grad))*0.45,0.0,0.35);
float rr=sqrt(uRough*uRough+aaR*aaR);
float rw=sqrt(uWide*uWide+aaR*aaR);
vec3 L2=normalize(vec3(0.45,-0.35,0.85));
vec3 H1=normalize(V+uSun);
float NoH1=max(dot(N,H1),0.0);
float NoL1=max(dot(N,uSun),0.0);
float F1=F0+(1.0-F0)*pow(1.0-max(dot(V,H1),0.0),5.0);
vec3 H2=normalize(V+L2);
float NoH2=max(dot(N,H2),0.0);
float NoL2=max(dot(N,L2),0.0);
float F2=F0+(1.0-F0)*pow(1.0-max(dot(V,H2),0.0),5.0);
col+=ggx(NoH1,NoV,NoL1,rw,F1)*uSheen+ggx(NoH1,NoV,NoL1,rr,F1)*uGloss+ggx(NoH2,NoV,NoL2,rw*1.5,F2)*uSheen*0.35;
col*=1.0-0.115*smoothstep(0.15,1.35,length(grad));
col=mix(col,1.0-exp(-col),smoothstep(0.75,1.5,col));
col=mix(col*12.92,1.055*pow(max(col,0.0),1.0/2.4)-0.055,step(0.0031308,col));
float ft=fract(uTime);
col+=(hash21(gl_FragCoord.xy+ft*55.0)+hash21(gl_FragCoord.yx+ft*30.0+10.0)-1.0)*0.00395;
fragColor=vec4(col,col,col,1.0);
}`
				function build(fsrc, names, out) {
					var p = gl.createProgram()
					for (const d of [
						[gl.VERTEX_SHADER, VERT],
						[gl.FRAGMENT_SHADER, fsrc]
					]) {
						var sh = gl.createShader(d[0])
						gl.shaderSource(sh, d[1])
						gl.compileShader(sh)
						gl.attachShader(p, sh)
						gl.deleteShader(sh)
					}
					gl.linkProgram(p)
					if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
						console.error(gl.getProgramInfoLog(p))
						return null
					}
					for (const nm of names) out[nm] = gl.getUniformLocation(p, nm)
					return p
				}
				var S = {},
					R = {}
				var pSim = null,
					pRen = null
				var AMP = 2.5,
					STEEP = 0.25,
					WARP = 400,
					SWELL = 0.005,
					SWELL_CALM = 0.0025,
					EDGE_LIM = 0.35,
					DROP = 0.75
				var DECAY = 0.985,
					DAMP_H = 0.9985,
					WHEEL_FADE = 10,
					SLEEP_AFTER = 2.5,
					SHAPE_STEP = 1 / 60
				var NU = 0.25,
					RADIUS = 0.05,
					K_WAVE = 0.35,
					RATE = 300,
					TELEPORT = 30,
					STROKE = 1.5,
					SIM_H = 360,
					CH = 70
				var CPU_REL = (CH / SIM_H) * (CH / SIM_H)
				function setConst(prog, loc, map) {
					gl.useProgram(prog)
					gl.uniform1i(loc.uState, 0)
					for (const k of Object.keys(map)) gl.uniform1f(loc[k], map[k])
				}
				function initGL() {
					gl.getExtension('EXT_color_buffer_float')
					gl.getExtension('OES_texture_float_linear')
					gl.getExtension('EXT_color_buffer_half_float')
					pSim = build(
						FRAG_SIM,
						[
							'uState',
							'uAspect',
							'uK',
							'uDampV',
							'uDampH',
							'uNu',
							'uRadius',
							'uAmp',
							'uEdge',
							'uDT',
							'uSA',
							'uDrop'
						],
						S
					)
					pRen = build(
						FRAG_RENDER,
						[
							'uState',
							'uAspect',
							'uFloor',
							'uTime',
							'uGradScale',
							'uEta',
							'uDepth',
							'uIor',
							'uRough',
							'uWide',
							'uSheen',
							'uGloss',
							'uSwell',
							'uSigma',
							'uSun'
						],
						R
					)
					if (!pSim || !pRen) {
						bail()
						return false
					}
					gl.bindVertexArray(gl.createVertexArray())
					gl.activeTexture(gl.TEXTURE0)
					gl.clearColor(0, 0, 0, 1)
					setConst(pSim, S, {
						uK: K_WAVE,
						uDampV: DECAY,
						uDampH: DAMP_H,
						uNu: NU,
						uRadius: RADIUS,
						uAmp: AMP,
						uEdge: 0.055
					})
					gl.uniform3f(S.uDrop, 0, 0, 0)
					setConst(pRen, R, {
						uGradScale: STEEP * SIM_H * 0.25,
						uEta: STEEP,
						uDepth: 0.25,
						uIor: 0.75,
						uRough: 0.15,
						uWide: 0.5,
						uSheen: 1.85,
						uGloss: 1.65,
						uSwell: reduced ? SWELL_CALM : SWELL,
						uSigma: 3.0
					})
					gl.uniform3f(R.uSun, -0.3495, 0.425, 0.835)
					A = null
					B = null
					simW = 0
					saOff = false
					return true
				}
				if (!initGL()) return
				var fmtI = F32 ? gl.RG32F : gl.RG16F,
					fmtF = gl.RG,
					fmtT = F32 ? gl.FLOAT : gl.HALF_FLOAT
				var TPAR = [
					[gl.TEXTURE_MIN_FILTER, gl.LINEAR],
					[gl.TEXTURE_MAG_FILTER, gl.LINEAR],
					[gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],
					[gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]
				]
				function makeTarget(w, h) {
					for (;;) {
						var tex = gl.createTexture()
						gl.bindTexture(gl.TEXTURE_2D, tex)
						gl.texImage2D(gl.TEXTURE_2D, 0, fmtI, w, h, 0, fmtF, fmtT, null)
						for (const t of TPAR) gl.texParameteri(gl.TEXTURE_2D, t[0], t[1])
						var fbo = gl.createFramebuffer()
						gl.bindFramebuffer(gl.FRAMEBUFFER, fbo)
						gl.framebufferTexture2D(
							gl.FRAMEBUFFER,
							gl.COLOR_ATTACHMENT0,
							gl.TEXTURE_2D,
							tex,
							0
						)
						if (
							gl.checkFramebufferStatus(gl.FRAMEBUFFER) ===
							gl.FRAMEBUFFER_COMPLETE
						) {
							gl.viewport(0, 0, w, h)
							gl.clear(gl.COLOR_BUFFER_BIT)
							return { tex: tex, fbo: fbo }
						}
						gl.deleteTexture(tex)
						gl.deleteFramebuffer(fbo)
						if (fmtF === gl.RGBA) return null
						fmtI = F32 ? gl.RGBA32F : gl.RGBA16F
						fmtF = gl.RGBA
					}
				}
				var A = null,
					B = null,
					simW = 0,
					aspect = 1,
					dprCap = 2,
					viewW = 1,
					viewH = 1
				var CW = 0,
					cH = null,
					cV = null,
					cL = null
				function buildCpuField() {
					var w = Math.max(8, Math.round(CH * aspect))
					if (w === CW && cH) return
					CW = w
					var n = w * CH
					cH = new Float32Array(n)
					cV = new Float32Array(n)
					cL = new Float32Array(n)
				}
				function allocTargets(nw) {
					if (A) {
						gl.deleteTexture(A.tex)
						gl.deleteFramebuffer(A.fbo)
					}
					if (B) {
						gl.deleteTexture(B.tex)
						gl.deleteFramebuffer(B.fbo)
					}
					simW = nw
					A = makeTarget(nw, SIM_H)
					B = makeTarget(nw, SIM_H)
					if (A && B) return true
					simW = 0
					bail()
					return false
				}
				function resize() {
					var vw = innerWidth || document.documentElement.clientWidth || 0
					var vh = innerHeight || document.documentElement.clientHeight || 0
					if (vw < 1 || vh < 1) return
					var dpr = Math.min(devicePixelRatio || 1, dprCap)
					if (!Number.isFinite(dpr) || dpr < 0.5) dpr = 1
					viewW = vw
					viewH = vh
					canvas.width = Math.max(1, Math.round(vw * dpr))
					canvas.height = Math.max(1, Math.round(vh * dpr))
					canvas.style.width = vw + 'px'
					canvas.style.height = vh + 'px'
					aspect = vw / vh
					if (!Number.isFinite(aspect) || aspect <= 0) aspect = 1.75
					var nw = clamp(Math.round(SIM_H * aspect) || 65, 65, 1535)
					if (nw !== simW && !allocTargets(nw)) return
					buildCpuField()
					gl.useProgram(pSim)
					gl.uniform2f(S.uAspect, aspect, 1)
					gl.useProgram(pRen)
					gl.uniform2f(R.uAspect, aspect, 1)
					gl.uniform3f(R.uFloor, aspect * 0.5, 0.5, 1 / Math.max(aspect, 1))
					measureShapes()
					updateShapes(true)
				}
				function mkAgent() {
					return {
						id: null,
						x: 0.5,
						y: 0.5,
						px: 0.5,
						py: 0.5,
						down: 0,
						gain: 0,
						vx: 0,
						vy: 0,
						moved: false,
						fresh: true
					}
				}
				var agents = [mkAgent(), mkAgent()]
				var wheel = { life: 0, ax: 0.5, ay: 0.5, bx: 0.5, by: 0.5, vy: 0 }
				var ptrX = 0.5,
					ptrY = 0.5
				function agentFor(e) {
					if (e.pointerType === 'mouse') {
						if (agents[0].id === null) {
							agents[0].id = 'mouse'
							agents[0].fresh = true
						}
						return agents[0]
					}
					for (const a of agents) if (a.id === e.pointerId) return a
					for (const a of agents)
						if (a.id === null) {

					if (stirred) slept = false
					if (!asleep) simulate(dt, steps, dropStep)
					wheel.life = Math.max(0, wheel.life - dt * WHEEL_FADE)
					if (!asleep) stirCpu(dt)
					else if (!slept) sleepAll()
					for (const a of agents) {
						a.px = a.x
						a.py = a.y
						a.moved = false
					}
					present()
					adapt(dt)
				}
				canvas.addEventListener('webglcontextlost', function (e) {
					e.preventDefault()
					cancelAnimationFrame(raf)
					raf = 0
					A = null
					B = null
					bail()
				})
				canvas.addEventListener('webglcontextrestored', function () {
					if (!initGL()) return
					resize()
					if (!A || !B) return
					document.body.classList.remove('nogl')
					last = performance.now()
					if (!raf) raf = requestAnimationFrame(frame)
				})
				var rt = 0
				function later(ms) {
					clearTimeout(rt)
					rt = setTimeout(resize, ms)
				}
				addEventListener('resize', function () {
					later(120)
				})
				addEventListener('orientationchange', function () {
					later(250)
				})
				document.addEventListener('visibilitychange', function () {
					markFresh()
					if (document.hidden) {
						cancelAnimationFrame(raf)
						raf = 0
					} else if (!raf) {
						last = performance.now()
						raf = requestAnimationFrame(frame)
					}
				})
				motionMq.addEventListener('change', function (e) {
					reduced = e.matches
					gl.useProgram(pRen)
					gl.uniform1f(R.uSwell, reduced ? SWELL_CALM : SWELL)
				})
				resize()
				raf = requestAnimationFrame(frame)
			})()
		</script>
	</body>
</html>
